version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dairy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dairy_user
      POSTGRES_PASSWORD: dairy_password
      POSTGRES_DB: dairy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairy_user -d dairy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dairy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
